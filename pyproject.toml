[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "customer-driven"
version = "0.1.0"
description = "Toolkit for text chunking and similarity analysis"
requires-python = ">=3.10"
dependencies = [
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
# The notebooks are stripped by nbstripout before every commit; leave their cells as written
extend-exclude = ["*.ipynb"]